{% for hazard in hazards %}
<div id="hazard-{{ hazard.id }}" class="modal">
  <div class="modal-background"></div>
  <div class="modal-content">
    <div class="box">
      <div class="content">
          <h1>{{ hazard.name }}</h1>

          <p>{{ hazard.description }}</p>
          <p>{{ hazard.category_name }}</p>
          <p>{{ hazard.category_description }}</p>
      </div>
    </div>
  </div>
  <button class="modal-close is-large" aria-label="close"></button>
</div>
{% endfor %}
