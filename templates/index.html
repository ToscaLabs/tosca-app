<!DOCTYPE html>
<html>

    <!-- START HEAD -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ index.title }}</title>
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <!-- Bulma Version 1.0.0 -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
        <!-- Font Awesome 6.5.2 -->
        <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
        >
    </head>
    <!-- END HEAD -->

    <body>

        <!-- DEVICES -->
        <div class="container mt-5 mb-3 px-3">
            {% if index.devices | length > 0 %}
                <h2 class="subtitle is-2 is-size-3-mobile has-text-black has-text-centered mt-5 px-2" style="white-space: nowrap;">{{ index.no_devices_message }}</h2>
            {% else %}
                <div class="grid">
                    {% block device %}{% endblock %}
                </div>
            {% endif %}

            <!-- BUTTON TO DISCOVER NEW DEVICES -->
            <form class="field is-centered has-text-centered pt-4 mt-4" method="post">
                <p class="control">
                    <input type="hidden" name="_method" value="put">
                    <button class="button is-large is-size-5-mobile is-responsive is-success" type="submit">{{ index.discover_message }}</button>
                </p>
            </form>
        </div>
        <!-- END DEVICES -->

        {% block modal_device %}{% endblock %}

        {% block modal_hazards %}{% endblock %}

<script type="text/javascript">

// Load modal code.
document.addEventListener('DOMContentLoaded', () => {
  // Functions to open and close a modal
  function openModal($el) {
    $el.classList.add('is-active');
  }

  function closeModal($el) {
    $el.classList.remove('is-active');
  }

  function closeAllModals() {
    (document.querySelectorAll('.modal') || []).forEach(($modal) => {
      closeModal($modal);
    });
  }

  // Add a click event on buttons to open a specific modal
  (document.querySelectorAll('.info-icon, .hazards') || []).forEach(($trigger) => {
    const modal = $trigger.dataset.target;
    const $target = document.getElementById(modal);

    $trigger.addEventListener('click', () => {
      openModal($target);
    });
  });

  // Add a click event on various child elements to close the parent modal
  (document.querySelectorAll('.modal-background, .modal-close, .modal-card-head .delete, .modal-card-foot .button') || []).forEach(($close) => {
    const $target = $close.closest('.modal');

    $close.addEventListener('click', () => {
      closeModal($target);
    });
  });

  // Add a keyboard event to close all modals
  document.addEventListener('keydown', (event) => {
    if(event.key === "Escape") {
      closeAllModals();
    }
  });
});

{% if not index.devices | length > 0  %}
// Send form data to a server.
function sendForm(id) {
  document.getElementById(id).click();
}
{% endif %}

</script>
    </body>
</html>
