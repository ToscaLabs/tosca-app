{% extends "templates/layout" %}

{% block device %}
    <div class="container mt-5 mb-3 px-3">
        {% if index.devices | length == 0 %}
            <h2 class="subtitle is-2 is-size-3-mobile has-text-black has-text-centered mt-5 px-2 no-wrap">{{ index.no_devices_message }}</h2>
        {% else %}
            {% block devices %}{% endblock %}
        {% endif %}

        <!-- BUTTON TO DISCOVER NEW DEVICES -->
        <form class="field is-centered has-text-centered pt-4 mt-4" method="post">
            <p class="control">
                <input type="hidden" name="_method" value="put">
                <button class="button is-large is-size-5-mobile is-responsive is-success" type="submit">{{ index.discover_message }}</button>
            </p>
        </form>
    </div>

    {% block modal_device %}{% endblock %}

    {% block modal_hazards %}{% endblock %}

{% endblock %}
