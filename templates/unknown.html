{% for request in device.requests %}
{% set route = device.requests[request] %}
<div class="card">
    <header class="card-header has-background-success-35">
        <p class="card-header-title is-centered has-text-centered is-size-5-mobile">
            <font class="is-size-6-mobile">{{ request }}</font>
            <button class="info-icon js-modal-trigger pl-1 pt-0" data-target="modal-{{ device.description.kind }}-{{ device_index }}-{{ loop.index0 }}">
                <span class="icon is-size-6-mobile">
                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                </span>
            </button>
        </p>
    </header>
    <div class="card-content has-text-centered">
        <div class="columns is-multiline is-mobile is-centered">
        {% for hazard in route.hazards %}
        {% set category = hazard_category(hazard) %}
           <div class="column">
               <button class="js-modal-trigger" data-target="hazard-{{ hazard_id(hazard) }}">
                   {% if category == "Safety" %}
                   <span class="tag is-medium is-danger">
                   {% elif category == "Financial" %}
                   <span class="tag is-medium is-warning">
                   {% else %}
                   <span class="tag is-medium is-info">
                   {% endif %}
                   {{ hazard_name(hazard) }}
                   </span>
               </button>
           </div>
        {% endfor %}
        </div>
    </div>
</div>
{% endfor %}
