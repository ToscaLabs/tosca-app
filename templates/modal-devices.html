{% for device in devices %}
<div id="modal-{{ device.description.kind }}-{{ loop.index0 }}" class="modal">
  <div class="modal-background"></div>
  <div class="modal-content">
    <div class="box">
        <div class="content">
          <h1>{{ device.description.kind }}</h1>

          <p>Main Route: {{ device.description.main_route }}</p>
        </div>
    </div>
  </div>
  <button class="modal-close is-large" aria-label="close"></button>
</div>
{% endfor %}
