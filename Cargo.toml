[package]
name = "web-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
ascot.version = "0.1.0"
ascot.git = "https://github.com/SoftengPoliTo/ascot"

ascot-controller.version = "0.1.0"
ascot-controller.git = "https://github.com/SoftengPoliTo/ascot"

axum.version = "0.8.0"
axum.default-features = false
axum.features = ["tokio", "http1", "http2", "json"]

chrono.version = "0.4"
chrono.default-features = false
chrono.features = ["clock"]

minijinja.version = "2.10.0"
minijinja.default-features = false
minijinja.features = ["serde"]

serde.version = "1.0"
serde.default-features = false
serde.features = ["derive"]

tokio.version = "1.0"
tokio.default-features = false
tokio.features = ["rt-multi-thread"]

tracing.version = "0.1"
tracing.default-features = false
tracing.optional = true

tracing-subscriber.version = "0.3"
tracing-subscriber.default-features = false
tracing-subscriber.features = ["fmt", "json"]
tracing-subscriber.optional = true

[features]
default = ["logging"]
logging = ["tracing", "tracing-subscriber"]
italian = []

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "unwind"
incremental = false
overflow-checks = false
strip = "debuginfo"
